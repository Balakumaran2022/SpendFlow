<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <!-- PWA: viewport with safe-area + no zoom on inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA: Theme color (light + dark) -->
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: dark)" />

    <!-- PWA: Apple / iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpendFlow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>SpendFlow | Smart Expense Tracker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register SW in production only
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (import.meta && import.meta.env && import.meta.env.DEV) {
            // Unregister all SWs in dev to avoid stale cache
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
            });
          } else {
            navigator.serviceWorker.register('/sw.js').catch(err =>
              console.warn('SW registration failed:', err)
            );
          }
        });
      }
    </script>
  </body>
</html>
