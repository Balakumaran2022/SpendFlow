<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spendflow-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Luxury Mark Gradient -->
    <linearGradient id="spendflow-gold-cyan" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="spendflow-accent" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#spendflow-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" stroke="url(#spendflow-gold-cyan)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- S-Flow Wave Luxury Mark -->
    <path d="M160 176C160 149.49 181.49 128 208 128H304C330.51 128 352 149.49 352 176C352 202.51 330.51 224 304 224H208C181.49 224 160 245.49 160 272C160 298.51 181.49 320 208 320H304C330.51 320 352 341.49 352 368C352 394.51 330.51 416 304 416H208C181.49 416 160 394.51 160 368" stroke="url(#spendflow-gold-cyan)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Flow Diamond Node -->
    <circle cx="256" cy="272" r="32" fill="url(#spendflow-accent)"/>
    <circle cx="256" cy="272" r="14" fill="#FFFFFF"/>
  </g>
</svg>